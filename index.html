  function timetable(tutor,day) {
    const y=Number((tutor||'7A').match(/\d+/)?.[0])||7;
    const g=(tutor||'7A').charCodeAt((tutor||'7A').length-1)-65;
    const d=['Monday','Tuesday','Wednesday','Thursday','Friday'].indexOf(day);
    if(d<0) return [];
    const times=['08:50–09:45','09:45–10:40','11:00–11:55','11:55–12:50','13:35–14:30'];

{id:'beginning',title:'Why OneEducation was created',year:'2012 · The beginning',icon:'archive',status:'Origin story',teaser:'One school workspace instead of dozens of separate registers, folders and spreadsheets.',why:'In the fictional OneEducation story, the first system was planned because office staff and teachers needed a single, dependable place to manage the school day. Registers, pupil details, room lists and school notices were otherwise spread across paper files and disconnected tools.',original:'The 2012 concept brought student records, attendance, timetables, behaviour, messages and basic reports under one sign-in and a consistent menu. Its purpose was to make everyday administration faster, clearer and easier to teach new staff.',later:'As the fictional product family grew, the all-in-one idea gave way to more specialised services. One Educate focused on school management while OneLearn developed a wider education ecosystem. This 2012 interface became a preserved legacy demo.',legacy:'OneEducation came first in this project timeline. One Educate and OneLearn were formed and branched off later.'},
{id:'dashboard',title:'The original staff dashboard',year:'2012 · Daily overview',icon:'home',status:'Redesigned later',teaser:'A quick morning snapshot of attendance, lesson changes and important notices.',why:'Staff needed the most useful information immediately after signing in, without opening half a dozen paper registers or separate screens.',original:'The 2012 dashboard showed a few straightforward panels, status colours, staff links and a classic left-hand menu. The information was intentionally compact and predictable.',later:'In the demo history, the old dashboard layout was replaced by configurable widgets, better accessibility and more tailored roles. Fixed panels were less helpful as school workflows became more complex.',legacy:'The glossy panel headers and navy sidebar are kept here deliberately so the archive feels unmistakably like 2012.'},
{id:'directory',title:'Student directory and profiles',year:'2012 · Core records',icon:'users',status:'Expanded later',teaser:'Search pupils by name, year or tutor group without searching a filing cabinet.',why:'A digital pupil directory meant office and teaching staff could find basic class and contact information from one consistent list.',original:'The first concept used a name/ID search, simple tutor-group filters and one-page profiles holding basic school information.',later:'The fictional newer system expanded permissions, improved search and separated sensitive information from routine teacher views. The early, simplified profile layout was retired.',legacy:'This interactive archive seeds exactly 1,400 entirely fictional students. It must not be used for real pupil records.'},
{id:'register',title:'Attendance registers',year:'2012 · Core feature',icon:'check',status:'Modernised later',teaser:'Replace a paper tick sheet with present, absent and late registration marks.',why:'Schools needed a quicker way to record morning registration and spot missing marks before chasing attendance information.',original:'Teachers selected a form and date, then set simple present, authorised absence, unauthorised absence or late marks. The office could export a summary.',later:'In the imagined later product, the basic register was superseded by better lesson-level records, alerts, reporting workflows and more nuanced attendance codes. The original four-mark screen was retired.',legacy:'Try changing a mark in Staff → Attendance; the fictional pupil’s portal will show the change.'},
{id:'timetable',title:'The built-in timetable',year:'2012 · Teaching day',icon:'calendar',status:'Replaced later',teaser:'Give each class a clear five-period schedule with teachers and rooms.',why:'Staff and pupils wanted a place to check what lesson was next, which room it used and who was teaching.',original:'OneEducation originally displayed simple fixed weekly timetables organised by tutor group, with one teaching room and teacher per lesson.',later:'The fictional legacy scheduler was replaced because cover, split classes, option blocks, room changes and timetable clashes require a more capable engine.',legacy:'The demo generates a stable timetable for 40 tutor groups. It is not a professional scheduling solver.'},
{id:'behaviour',title:'Behaviour log and rewards',year:'2012 · Classroom records',icon:'star',status:'Redesigned later',teaser:'Store incidents, recognitions and simple reward points together.',why:'Teachers wanted fairer, more consistent records of praise and classroom concerns that could be reviewed over time.',original:'The legacy log recorded a student, date, short reason, signed point score and whether an incident was open or resolved.',later:'In the imagined later system, the simple points screen gave way to more contextual pastoral support, better follow-up workflows and tighter staff permissions. The old one-size-fits-all log was no longer enough.',legacy:'A behaviour log should support a student’s progress, not reduce them to a number.'},
{id:'reports',title:'Classic printable reports',year:'2012 · School office',icon:'chart',status:'Partly retired',teaser:'Turn pupil and attendance tables into clear summaries for the office.',why:'Office staff needed printable summaries without re-counting registers and writing totals by hand.',original:'The original concept had a small reporting suite: headcounts, attendance percentages, reward totals and printable or spreadsheet-friendly tables.',later:'Some static report templates were retired as dashboards and custom exports became easier to maintain. Schools wanted to choose what they saw, instead of receiving one fixed paper report.',legacy:'This demo still exports CSV and supports browser printing. It has no live data warehouse.'},
{id:'messages',title:'Old-style school messages',year:'2012 · Communication',icon:'mail',status:'Replaced later',teaser:'One place for school notices instead of relying on loose slips and emails.',why:'Important reminders were easier to distribute when staff and students could see them in one school system.',original:'Early messages looked like a basic inbox and noticeboard with simple audiences: everyone, a year group, a form or an individual pupil.',later:'The fictional successor replaced this system with richer delivery controls, more accessible notifications and safer audience permissions. The primitive bulletin-style composer was archived.',legacy:'Staff-created demo messages can appear in the matching pupil inbox in the same browser.'},
{id:'student-portal',title:'The first student portal',year:'2012 · A pupil view',icon:'graduation',status:'Grew into newer apps',teaser:'Let pupils view their own timetable, messages and progress.',why:'The staff system was useful, but students also needed a simple and friendly place to find the school information relevant to them.',original:'A lightweight personal dashboard showed the school day, homework, house points, attendance and inbox without all the office administration controls.',later:'As the project branched into OneLearn services, the pupil experience evolved toward a more focused home and study space. This original portal layout remained part of the archive.',legacy:'Use the Student portal button at the top of this website to explore the separate vintage pupil interface.'},
{id:'homework',title:'Simple homework planner',year:'2012 · Pupil organisation',icon:'book',status:'Superseded later',teaser:'A digital to-do list for subject work and hand-in dates.',why:'Students benefited from seeing every assignment and deadline in the same place rather than depending only on a paper planner.',original:'The 2012 design gave each assignment a subject, title and due date, with a straightforward completion tick.',later:'In the in-universe timeline, the basic checklist approach was eventually superseded by richer subject-specific learning experiences associated with the wider OneLearn family, such as OneReader, OneMaths and OneStudy.',legacy:'Homework ticks still work in this demo, but they do not submit work to a real teacher.'},

function head(title,desc,actions=''){return `<div class="page-header"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;}
function adminDashboard(){const stud=allStudents();const t=tally(stud);const percent=Math.round(t.P/stud.length*100);const lessons=S.timetable('11C','Friday');const recent=allBehaviour().slice(0,4);const pct=Number((t.P/stud.length*100).toFixed(1));return `${head('Welcome back, Mr Carter','Your school at a glance · Friday, 16 March 2012',`<button class="btn" data-action="export-students">${ic('download')} Export data</button>`)}<div class="intro-strip"><span class="intro-icon">${ic('archive')}</span><div><strong>Welcome to the OneEducation (2012) archive.</strong><p>An interactive reconstruction of the system that existed before One Educate and OneLearn were formed and branched off.</p></div></div><div class="history-teaser"><div>${ic('info')} <span><strong>New: Click through the 2012 history</strong><small>Discover why the original features were added, and why newer systems changed them.</small></span></div><button class="btn primary" data-action="goto" data-page="history">Explore history ${ic('arrow')}</button></div><div class="dashboard-grid">${panel('Attendance today','chart',`<div class="panel-inner"><div class="attendance-overview"><div class="donut" style="background:conic-gradient(#56ad80 0 ${pct}%,#d2dce5 ${pct}% 97%,#859cad 97% 99%,#f0c881 99%)"><div class="donut-core"><strong>${percent}%</strong><span>Present</span></div></div><div class="legend">${[['P','Present','#56ad80'],['A','Authorised absent','#d2dce5'],['U','Unauthorised absent','#859cad'],['L','Late','#f0c881']].map(([k,name,c])=>`<div class="legend-line"><span class="legend-label"><i class="dot" style="background:${c}"></i>${name}</span><strong>${fmt(t[k])}</strong></div>`).join('')}</div></div></div><div class="panel-foot"><span>${fmt(stud.length)} demo pupils</span><span>Demo registers: 16 Mar 2012</span></div>`,`<button class="small-link" data-action="goto" data-page="attendance">Open registers →</button>`)}${panel('Friday timetable · 11C','calendar',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Subject</th><th>Room</th></tr></thead><tbody>${lessons.map((l,i)=>`<tr class="${i===2?'is-current':''}"><td>${l.time.slice(0,5)}</td><td><b>${esc(l.subject)}</b><div style="font-size:10px;color:#8493a1">${esc(l.teacher)}</div></td><td>${esc(l.room)}</td></tr>`).join('')}</tbody></table></div>`,`<button class="small-link" data-action="goto" data-page="timetable">Full timetable →</button>`)}<aside class="rail">${flap('Important information','info','This whole website was created before <b>One Educate</b> and <b>OneLearn</b> were formed and branched off. This is the fictional 2012-era legacy prototype.','important')}${flap('Demo environment','archive','All 1,400 starting pupil records are fictional. This recreation uses browser storage—not a school server.','notice')}</aside>${panel('Recent behaviour','star',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Pupil</th><th>Event</th><th>Points</th></tr></thead><tbody>${recent.map(b=>`<tr><td><button class="table-link" data-action="profile" data-id="${b.studentId}">${esc(getStudent(b.studentId)?.name||'Pupil')}</button></td><td>${esc(b.reason)}</td><td><span class="pill ${b.points>=0?'good':'bad'}">${b.points>0?'+':''}${b.points}</span></td></tr>`).join('')}</tbody></table></div>`,`<button class="small-link" data-action="goto" data-page="behaviour">View all →</button>`)}${panel('School announcements','bell',`<div class="panel-inner">${allMessages().filter(m=>m.to==='All students').slice(0,3).map(m=>`<div class="announce"><span class="date-block"><strong>${m.date.slice(-2)}</strong><small>MAR</small></span><div><h3>${esc(m.subject)}</h3><p>${esc(m.body).slice(0,110)}${m.body.length>110?'…':''}</p></div></div>`).join('')}</div>`,`<button class="small-link" data-action="goto" data-page="messages">Messages →</button>`)}${panel('Quick actions','spark',`<div class="quick-links">${[['Search all students','students','users'],['Record registration','attendance','check'],['New behaviour log','new-behaviour','star'],['Compose message','new-message','mail'],['Open student portal','open-portal','graduation']].map(([a,p,i])=>`<button class="quick-btn" data-action="${p.startsWith('new-')||p==='open-portal'?p:'goto'}" ${p.startsWith('new-')||p==='open-portal'?'':`data-page="${p}"`}><span>${ic(i)} ${a}</span>${ic('arrow')}</button>`).join('')}</div>`)} </div><div class="history-section-head compact"><h2>${ic('archive')} Explore the original features</h2><button class="small-link" data-action="goto" data-page="history">All 16 stories →</button></div><div class="history-grid featured-history">${historyCollection(['beginning','register','timetable','behaviour','student-portal','onelearn'])}</div>`;}
function studentsPage(){let list=allStudents();const search=ui.query.trim().toLowerCase();if(search)list=list.filter(s=>(s.name+' '+s.id+' '+s.tutor+' '+s.house).toLowerCase().includes(search));if(ui.year!=='all')list=list.filter(s=>String(s.year)===ui.year);if(ui.tutor!=='all')list=list.filter(s=>s.tutor===ui.tutor);const pages=Math.max(1,Math.ceil(list.length/20));ui.studentPage=Math.min(ui.studentPage,pages-1);const slice=list.slice(ui.studentPage*20,(ui.studentPage+1)*20);return `${head('Student directory',`${fmt(allStudents().length)} fictional pupil records in the 2012 test register.`,`<button class="btn primary" data-action="new-student">${ic('plus')} Add demo pupil</button><button class="btn" data-action="export-students">${ic('download')} Export CSV</button>`)}${panel('Find a student','search',`<div class="toolbar"><input id="student-search" class="field search" placeholder="Search name, ID, tutor group or house..." value="${esc(ui.query)}" aria-label="Search pupils"><button class="btn primary" data-action="search-students">${ic('search')} Search</button><select class="select" data-filter="year">${yearOptions(ui.year)}</select><select class="select" data-filter="tutor">${tutorOptions(ui.tutor,true)}</select><button class="btn" data-action="clear-search">Clear</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Pupil ID</th><th>Full name</th><th>Year</th><th>Form</th><th>House</th><th>Points</th><th></th></tr></thead><tbody>${slice.map(s=>`<tr><td style="color:#738b9e">${esc(s.id)}</td><td><button class="table-link" data-action="profile" data-id="${s.id}"><strong>${esc(s.name)}</strong></button></td><td>Year ${s.year}</td><td>${esc(s.tutor)}</td><td>${esc(s.house)}</td><td><span class="pill gold">${persPoints(s)}</span></td><td><button class="btn" data-action="profile" data-id="${s.id}">Open ${ic('arrow')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No pupils found. Try changing the filters.</td></tr>`}</tbody></table></div><div class="table-bottom"><span>Showing ${list.length?ui.studentPage*20+1:0}–${Math.min((ui.studentPage+1)*20,list.length)} of ${fmt(list.length)} results</span><div class="pager"><button class="btn" data-action="prev-page" ${ui.studentPage===0?'disabled':''}>Previous</button><span>Page ${ui.studentPage+1} / ${pages}</span><button class="btn" data-action="next-page" ${ui.studentPage>=pages-1?'disabled':''}>Next</button></div></div>`)}<div class="notes-grid">${flap('Real demo searches','search','All 1,400 initial records are generated locally and support live name, year, form and ID filtering.')}${flap('Fictional school data','info','Names, houses, marks and classes are invented for demonstration, not obtained from real school records.')}${flap('Add and edit','pencil','Changes to this directory persist in your browser until you reset the archived demo.')}</div>`;}
function attendancePage(){let group=allStudents().filter(s=>s.tutor===ui.attTutor);const t=tally(group);return `${head('Attendance registers','Record marks by date and tutor group in the original 2012 register.',`<button class="btn" data-action="export-attendance">${ic('download')} Export register</button>`)}<div class="stat-row">${[['P','Present'],['A','Authorised'],['U','Unauthorised'],['L','Late']].map(([m,l])=>`<div class="stat"><div class="label">${l}</div><strong>${t[m]}</strong><div class="hint">${Math.round(100*t[m]/(group.length||1))}% of ${group.length} pupils</div></div>`).join('')}</div>${panel('Class register','check',`<div class="toolbar"><label>Form <select class="select" data-filter="attTutor">${tutorOptions(ui.attTutor)}</select></label><label>Date <input type="date" class="field" data-filter="date" value="${esc(ui.date)}"></label><button class="btn primary" data-action="mark-all">${ic('check')} Mark all present</button><button class="btn" data-action="reset-register">Restore demo marks</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Student ID</th><th>Pupil</th><th>Tutor</th><th>Registration mark</th></tr></thead><tbody>${group.map(s=>`<tr><td>${esc(s.id)}</td><td><button class="table-link" data-action="profile" data-id="${s.id}">${esc(s.name)}</button></td><td>${esc(s.tutor)}</td><td><select class="select" data-mark="${s.id}" aria-label="Mark attendance for ${esc(s.name)}">${[['P','Present'],['A','Authorised absent'],['U','Unauthorised absent'],['L','Late']].map(([v,n])=>option(v,n,getMark(s.id,ui.date))).join('')}</select></td></tr>`).join('')}</tbody></table></div><div class="panel-foot"><span>Register: ${ui.attTutor} · ${dateNice(ui.date)}</span><span>Changes are stored only in this browser</span></div>`)}<div class="notes-grid">${flap('Attendance codes','info','<b>P</b> Present · <b>A</b> Authorised absence · <b>U</b> Unauthorised absence · <b>L</b> Late.')}${flap('Daily registers','calendar','Switch dates freely, mark an individual pupil, or mark the whole class present.')}${flap('Student visibility','graduation','Each fictional pupil can see their own attendance mark in the connected student portal.')}</div>`;}
function timetablePage(){const lessons=S.timetable(ui.timetableTutor,ui.day);return `${head('School timetable','Archived weekly teaching schedule · five periods per day.',`<button class="btn" data-action="print">${ic('printer')} Print</button>`)}${panel('Class timetable','calendar',`<div class="toolbar"><label>Tutor group <select class="select" data-filter="timetableTutor">${tutorOptions(ui.timetableTutor)}</select></label></div><div class="panel-inner"><div class="day-buttons">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<button class="day-button ${ui.day===d?'active':''}" data-action="day" data-day="${d}">${d}</button>`).join('')}</div><div class="schedule-list">${lessons.map(x=>`<div class="schedule-period"><div class="time">${x.time}<div style="font-size:10px;color:#a1b0bc">Period ${x.period}</div></div><div><h3>${esc(x.subject)}</h3><p>${esc(x.teacher)}</p></div><div class="room">${esc(x.room)}</div></div>`).join('')}</div></div>`)}<div class="notes-grid">${flap('Legacy timetable','clock','A fixed timetable sample is generated for all 40 tutor groups across Years 7–11.')}${flap('Rooms and teaching staff','users','Lessons include a teacher, time and room reference, all purely demonstrative.')}${flap('Student access','graduation','The portal automatically shows the timetable belonging to the selected fictional student.')}</div>`;}
function behaviourPage(){let list=allBehaviour();if(ui.behaviourKind!=='all')list=list.filter(b=>b.kind===ui.behaviourKind);return `${head('Behaviour & rewards','View the historic log, assign points and resolve incidents.',`<button class="btn primary" data-action="new-behaviour">${ic('plus')} Record event</button>`)}${panel('Behaviour record','star',`<div class="toolbar"><label>Event type <select class="select" data-filter="behaviourKind">${[['all','All events'],['Positive','Positive / reward'],['Negative','Negative / incident']].map(([v,l])=>option(v,l,ui.behaviourKind)).join('')}</select></label><span class="tip">${fmt(list.length)} events</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Student</th><th>Description</th><th>Type</th><th>Points</th><th>Status</th><th></th></tr></thead><tbody>${list.map(b=>`<tr><td>${dateNice(b.date)}</td><td><button class="table-link" data-action="profile" data-id="${b.studentId}">${esc(getStudent(b.studentId)?.name||b.studentId)}</button></td><td>${esc(b.reason)}</td><td><span class="pill ${b.kind==='Positive'?'good':'bad'}">${esc(b.kind)}</span></td><td><b>${b.points>0?'+':''}${Number(b.points)}</b></td><td>${esc(b.status)}</td><td>${b.status==='Open'?`<button class="btn" data-action="resolve-behaviour" data-id="${b.id}">Resolve</button>`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">No behaviour records.</td></tr>`}</tbody></table></div>`)}<div class="notes-grid">${flap('Rewards','star','Positive entries add points to the pupil’s total; rewards are visible in the student portal.')}${flap('Incidents','info','Log issues and mark them resolved. All incidents shown here are fabricated.')}${flap('Local-only records','archive','Entries remain in the browser, with no server synchronisation, moderation or real safeguarding system.','notice')}</div>`;}
function reportsPage(){const list=allStudents();const t=tally(list);const attendancePct=Math.round(t.P/list.length*100);const rows=S.years.map(y=>{const sub=list.filter(s=>s.year===y),a=tally(sub);return {y,count:sub.length,percent:Math.round(a.P/sub.length*100),positive:allBehaviour().filter(b=>b.kind==='Positive'&&getStudent(b.studentId)?.year===y).length};});return `${head('Reports & statistics','A simple recreation of the archived OneEducation reporting suite.',`<button class="btn primary" data-action="export-report">${ic('download')} Download CSV</button><button class="btn" data-action="print">${ic('printer')} Print report</button>`)}<div class="stat-row"><div class="stat"><div class="label">Total pupils</div><strong>${fmt(list.length)}</strong><div class="hint">Years 7–11</div></div><div class="stat"><div class="label">Present on selected date</div><strong>${attendancePct}%</strong><div class="hint">${dateNice(ui.date)}</div></div><div class="stat"><div class="label">Rewards logged</div><strong>${allBehaviour().filter(b=>b.kind==='Positive').length}</strong><div class="hint">Demo behaviour records</div></div><div class="stat"><div class="label">Tutor groups</div><strong>40</strong><div class="hint">8 per year group</div></div></div>${panel('Attendance by year group','chart',`<div class="panel-inner"><div class="report-bars">${rows.map(x=>`<div class="report-line"><strong>Year ${x.y}</strong><div class="progress"><span style="width:${x.percent}%"></span></div><b>${x.percent}%</b></div>`).join('')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Year</th><th>Pupils</th><th>Presence</th><th>Positive logs</th></tr></thead><tbody>${rows.map(x=>`<tr><td>Year ${x.y}</td><td>${fmt(x.count)}</td><td>${x.percent}%</td><td>${x.positive}</td></tr>`).join('')}</tbody></table></div>`)}<div class="notes-grid">${flap('Generated totals','chart','Statistics recalculate from the actual demo registers as you change attendance marks.')}${flap('CSV export','download','Student lists, attendance registers and year-group summary reports download as usable CSV files.')}${flap('An archive, not a live school','info','Original-era look, redesigned functionality. This version is not connected to any organisation.')}</div>`;}
function messagesPage(isPortal=false){const s=getStudent(ui.selectedStudent);let list=allMessages();if(isPortal)list=list.filter(m=>m.to==='All students'||m.to==='Year '+s.year||m.to===s.id||m.to===s.tutor);if(!isPortal&&ui.messageScope!=='all')list=list.filter(m=>m.to===ui.messageScope);return `${head(isPortal?'My messages':'School messages',isPortal?'Messages sent to your year group and school.':'Internal demo notices and messages.',isPortal?'':`<button class="btn primary" data-action="new-message">${ic('plus')} Compose message</button>`)}${panel(isPortal?'Inbox':'Sent and school messages','mail',`${!isPortal?`<div class="toolbar"><label>Recipient <select class="select" data-filter="messageScope">${[['all','All recipients'],['All students','Whole school'],...S.years.map(y=>['Year '+y,'Year '+y])].map(([v,l])=>option(v,l,ui.messageScope)).join('')}</select></label></div>`:''}${list.length?list.map(m=>`<div class="msg-row ${m.unread?'unread':''}"><div class="msg-icon">${ic('mail')}</div><div class="msg-copy"><strong>${esc(m.subject)}</strong><div class="msg-meta">From ${esc(m.from)} · To ${esc(m.to)} · ${dateNice(m.date)}</div><p>${esc(m.body)}</p></div>${!isPortal&&(db.messages||[]).some(x=>x.id===m.id)?`<button class="btn danger" data-action="delete-message" data-id="${m.id}">Delete</button>`:''}</div>`).join(''):`<div class="empty">No messages for this recipient.</div>`}`)}<div class="notes-grid">${flap('2012 messaging','mail','The legacy system offered a simple internal message board, without modern threads or real-time notifications.')}${flap('Schoolwide and targeted','users','Staff can send to all pupils, a year group, a tutor group, or a specific demo ID.')}${flap('Portal connection','graduation','Messages addressed to the pupil or their group immediately appear on the student side.')}</div>`;}
function calendarPage(isPortal=false){const [yy,mm]=ui.calendarMonth.split('-').map(Number);const start=(new Date(yy,mm-1,1).getDay()+6)%7;const days=new Date(yy,mm,0).getDate();const cells=[];const events=allEvents();for(let i=0;i<start;i++)cells.push('<div class="cal-day empty" aria-hidden="true"></div>');for(let d=1;d<=days;d++){const date=ui.calendarMonth+'-'+String(d).padStart(2,'0');const has=events.filter(x=>x.date===date);cells.push(`<button class="cal-day ${date==='2012-03-16'?'today':''}" data-action="event-date" data-date="${date}">${d}<div>${has.map(()=>'<i class="event-dot"></i>').join('')}</div></button>`);}return `${head('School calendar', 'Archived term events and school notices.',isPortal?'':`<button class="btn primary" data-action="new-event">${ic('plus')} Add event</button>`)}${panel('Calendar · '+new Date(yy,mm-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}),'calendar',`<div class="panel-inner"><div class="calendar-layout"><div><div class="month-head"><button class="btn" data-action="cal-prev">${ic('back')} Previous</button><strong>${new Date(yy,mm-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</strong><button class="btn" data-action="cal-next">Next ${ic('arrow')}</button></div><div class="month-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div><div><h3 style="font-size:13px;color:#37546a">School diary</h3><div class="event-list">${events.filter(e=>e.date.startsWith(ui.calendarMonth)).map(e=>`<div class="event-card"><div class="item-flex"><b>${esc(e.title)}</b>${!isPortal&&(db.events||[]).some(x=>x.id===e.id)?`<button class="btn danger" data-action="delete-event" data-id="${e.id}">Delete</button>`:''}</div><p>${dateNice(e.date)} · ${esc(e.type)}</p></div>`).join('')||'<p class="tip">No events this month.</p>'}</div></div></div></div>`)}<div class="notes-grid">${flap('Legacy diary','calendar','Switch months and browse the school diary without any external calendar account.')}${flap('Staff changes','pencil','Staff can add or remove locally created demo events; pupil views update automatically.')}${flap('Historical date','clock','The system is intentionally presented as an archive snapshot from March 2012.')}</div>`;}
function settingsPage(){return `${head('Demo settings','Manage the fictional school profile and local archive data.')}${panel('School details','settings',`<div class="panel-inner"><form id="settings-form"><div class="form-grid"><div class="form-group"><label for="schoolName">Demo school name</label><input class="field" name="schoolName" id="schoolName" required maxlength="70" value="${esc(db.schoolName)}"></div><div class="form-group"><label>Release</label><input class="field" value="OneEducation 1.2 / March 2012" disabled></div></div><div class="form-actions"><button class="btn primary" type="submit">Save changes</button></div></form></div>`)}<div style="height:15px"></div>${panel('Demo control centre','archive',`<div class="panel-inner"><p>The <b>Reset demo</b> button restores exactly 1,400 fictional pupil records, along with the original examples for attendance, behaviour, events and school notices. All saved edits will be lost.</p><div class="actions"><button class="btn danger" data-action="reset">${ic('archive')} Reset all demo data</button><button class="btn" data-action="export-students">${ic('download')} Back up students (CSV)</button></div></div>`)}<div class="notes-grid">${flap('Important historical note','info','This website represents OneEducation before the later One Educate and OneLearn branding and services branched off.','important')}${flap('Static website','archive','No passwords, server, real accounts or shared database. Intended for use as a local or GitHub Pages demo.')}${flap('No real records','users','Never enter real pupil details, safeguarding disclosures or confidential school data.','notice')}</div>`;}
function portalHome(){const s=getStudent(ui.selectedStudent);const ts=S.timetable(s.tutor,'Friday');const hw=S.seedHomework.filter(h=>h.year===s.year);const done=hw.filter(h=>db.homeworkDone?.[s.id+'_'+h.id]).length;const week=['2012-03-12','2012-03-13','2012-03-14','2012-03-15','2012-03-16'];const present=week.filter(d=>getMark(s.id,d)==='P').length;return `<div class="portico"><small>ONEEDUCATION STUDENT DESKTOP · 2012</small><h1>Hello, ${esc(s.first)}! <span aria-hidden="true">✦</span></h1><p>Welcome to your own little corner of Riverside Community School. Check your lessons, stay on top of homework, and collect rewards.</p></div><div class="portal-stats"><div class="portal-stat">${ic('star')}<div><strong>${persPoints(s)}</strong><small>Reward points</small></div></div><div class="portal-stat">${ic('check')}<div><strong>${present}/5</strong><small>Present this week</small></div></div><div class="portal-stat">${ic('book')}<div><strong>${hw.length-done}</strong><small>Homework to do</small></div></div><div class="portal-stat">${ic('users')}<div><strong>${esc(s.tutor)}</strong><small>Your tutor group</small></div></div></div><div class="portal-two">${panel('Friday · My school day','calendar',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Lesson</th><th>Room</th><th>Teacher</th></tr></thead><tbody>${ts.map(l=>`<tr><td>${l.period}</td><td><strong>${esc(l.subject)}</strong><div style="color:#8b9eab;font-size:10px">${l.time}</div></td><td>${esc(l.room)}</td><td>${esc(l.teacher)}</td></tr>`).join('')}</tbody></table></div>`,`<button class="small-link" data-action="goto" data-page="timetable">Week view →</button>`)}${panel('Homework noticeboard','book',`<div class="panel-inner">${hw.slice(0,3).map(h=>`<div class="notice-row"><div class="item-flex"><div><strong style="font-size:12px;color:#0d7966">${esc(h.subject)}</strong><h3>${esc(h.title)}</h3><p>Due ${dateNice(h.due)}</p></div><span class="pill ${db.homeworkDone?.[s.id+'_'+h.id]?'good':'gold'}">${db.homeworkDone?.[s.id+'_'+h.id]?'Done':'To do'}</span></div></div>`).join('')}</div>`,`<button class="small-link" data-action="goto" data-page="homework">See homework →</button>`)}${panel('My school locker · a little 2012 extra!','archive',`<div class="panel-inner"><p class="tip" style="margin:0 0 8px">A private notebook for this fictional pupil—saved in this browser.</p><textarea id="locker-note" class="textarea" style="width:100%" placeholder="Remember my PE kit...">${esc(db.lockerNotes?.[s.id]||'')}</textarea><div style="margin-top:8px;text-align:right"><button class="btn primary" data-action="save-locker">${ic('check')} Save locker note</button></div></div>`)}${panel('School noticeboard','bell',`<div class="panel-inner">${allMessages().filter(m=>m.to==='All students'||m.to==='Year '+s.year).slice(0,3).map(m=>`<div class="announce"><div class="date-block"><strong>${m.date.slice(-2)}</strong><small>MAR</small></div><div><h3>${esc(m.subject)}</h3><p>${esc(m.body).slice(0,108)}…</p></div></div>`).join('')}</div>`,`<button class="small-link" data-action="goto" data-page="messages">Inbox →</button>`)}</div><div class="history-section-head compact"><h2>${ic('archive')} From 2012 to the OneLearn era</h2><button class="small-link" data-action="goto" data-page="history">More history →</button></div><div class="history-grid featured-history">${historyCollection(['student-portal','homework','houses'])}</div>`;}
function portalTimetable(){const s=getStudent(ui.selectedStudent);return `${head('My timetable',`Your lessons for ${esc(s.tutor)} · School week, March 2012`)}${panel('Week at a glance','calendar',`<div class="panel-inner"><div class="day-buttons">${['Monday','Tuesday','Wednesday','Thursday','Friday'].map(d=>`<button class="day-button ${ui.day===d?'active':''}" data-action="day" data-day="${d}">${d}</button>`).join('')}</div><div class="schedule-list">${S.timetable(s.tutor,ui.day).map(l=>`<div class="schedule-period"><div class="time">${l.time}<div style="font-size:10px">Period ${l.period}</div></div><div><h3>${esc(l.subject)}</h3><p>${esc(l.teacher)}</p></div><div class="room">${esc(l.room)}</div></div>`).join('')}</div></div>`)}${flap('Five lessons a day','clock','Your timetable is automatically selected from your tutor group. Take care of your school books and arrive on time.')}`;}
function portalHomework(){const s=getStudent(ui.selectedStudent);const hw=S.seedHomework.filter(h=>h.year===s.year);const done=hw.filter(h=>db.homeworkDone?.[s.id+'_'+h.id]).length;return `${head('Homework planner',`${done} of ${hw.length} assignments completed`)}${panel('My assignments','book',`<div class="panel-inner">${hw.map(h=>`<div class="homework-card"><div><span class="subject">${esc(h.subject)}</span><h3>${esc(h.title)}</h3><p>Hand in by ${dateNice(h.due)}</p></div><button class="btn ${db.homeworkDone?.[s.id+'_'+h.id]?'':'primary'}" data-action="homework" data-id="${h.id}">${ic('check')} ${db.homeworkDone?.[s.id+'_'+h.id]?'Undo tick':'Mark done'}</button></div>`).join('')}</div>`)}<div class="notes-grid">${flap('Pupil control','book','Tick work when completed. Your own ticks are saved per demo student, so you can switch profiles safely.')}${flap('Historical assignments','clock','Sample assignments reflect the theme and workflow of an early-2010s homework board.')}${flap('Offline tracking','info','This demo cannot submit homework to teachers; it only stores completion ticks in your browser.')}</div>`;}
function portalAttendance(){const s=getStudent(ui.selectedStudent);const dates=['2012-03-12','2012-03-13','2012-03-14','2012-03-15','2012-03-16'];const marks=dates.map(d=>({date:d,mark:getMark(s.id,d)}));const p=marks.filter(x=>x.mark==='P').length;return `${head('My attendance','Your personal registration summary · Week of 12 March 2012')}${panel('This week','check',`<div class="panel-inner"><div class="stat-row" style="margin-bottom:0"><div class="stat"><div class="label">Present</div><strong>${p}/5</strong><div class="hint">This school week</div></div><div class="stat"><div class="label">Late</div><strong>${marks.filter(x=>x.mark==='L').length}</strong></div><div class="stat"><div class="label">Authorised</div><strong>${marks.filter(x=>x.mark==='A').length}</strong></div><div class="stat"><div class="label">Unauthorised</div><strong>${marks.filter(x=>x.mark==='U').length}</strong></div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Day</th><th>Date</th><th>Mark</th></tr></thead><tbody>${dates.map((d,i)=>`<tr><td>${['Monday','Tuesday','Wednesday','Thursday','Friday'][i]}</td><td>${dateNice(d)}</td><td>${markPill(getMark(s.id,d))}</td></tr>`).join('')}</tbody></table></div>`)}<div class="notes-grid">${flap('Staff-linked records','check','Any attendance marks entered in the matching staff register show up here immediately.')}${flap('Absence support','info','In a real school, contact staff about unexplained absences. This is only a fictional demo.')}${flap('Historical record','clock','The archived interface uses a fixed reference week in March 2012.')}</div>`;}
function portalBehaviour(){const s=getStudent(ui.selectedStudent);const list=allBehaviour().filter(b=>b.studentId===s.id);return `${head('My rewards',`Your house is ${esc(s.house)}. Great effort deserves recognition!`)}<div class="stat-row"><div class="stat"><div class="label">Reward points</div><strong>${persPoints(s)}</strong><div class="hint">Personal demo total</div></div><div class="stat"><div class="label">House</div><strong>${esc(s.house)}</strong><div class="hint">House team</div></div><div class="stat"><div class="label">Positive logs</div><strong>${list.filter(x=>x.kind==='Positive').length}</strong><div class="hint">Staff-recorded rewards</div></div><div class="stat"><div class="label">Recent events</div><strong>${list.length}</strong><div class="hint">Personal log entries</div></div></div>${panel('My achievements and behaviour record','star',`<div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Reason</th><th>Points</th></tr></thead><tbody>${list.map(b=>`<tr><td>${dateNice(b.date)}</td><td>${esc(b.reason)}</td><td><span class="pill ${b.points>=0?'good':'bad'}">${b.points>0?'+':''}${b.points}</span></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No recorded events yet. Keep up the good work!</td></tr>'}</tbody></table></div>`)}${flap('House points','star','This 2012 concept keeps track of school rewards and positive contributions. Only fictional behaviour is displayed.')}`;}
function portalProfile(){const s=getStudent(ui.selectedStudent);return `${head('My pupil record','Your fictional 2012 school identity card')}${panel('Pupil details','user',`<div class="panel-inner"><div class="profile-hero"><div class="avatar">${esc(s.first[0]+s.last[0])}</div><div><h2>${esc(s.name)}</h2><p>Student ID ${esc(s.id)} · ${esc(s.tutor)} · Demo record</p></div></div><div class="grid-details"><div class="detail"><small>Year group</small><strong>Year ${s.year}</strong></div><div class="detail"><small>Tutor group</small><strong>${esc(s.tutor)}</strong></div><div class="detail"><small>House</small><strong>${esc(s.house)}</strong></div><div class="detail"><small>Reward points</small><strong>${persPoints(s)}</strong></div><div class="detail"><small>School</small><strong>${esc(db.schoolName)}</strong></div><div class="detail"><small>Account type</small><strong>Demo student</strong></div></div></div>`)}<div class="notes-grid">${flap('Privacy first','info','This profile contains no real student information. There is no password or account system in the demo.')}${flap('Change students','users','Use the student selector at the top to test another fictional pupil from the 1,400-record dataset.')}${flap('2012 interface','archive','A deliberately simplified legacy pupil interface, before later One Educate and OneLearn products.')}</div>`;}
function page(){if(ui.section==='portal'){return ({home:portalHome,timetable:portalTimetable,homework:portalHomework,attendance:portalAttendance,behaviour:portalBehaviour,messages:()=>messagesPage(true),calendar:()=>calendarPage(true),profile:portalProfile,history:historyPage})[ui.page]?.()||portalHome();}
return ({dashboard:adminDashboard,students:studentsPage,attendance:attendancePage,timetable:timetablePage,behaviour:behaviourPage,reports:reportsPage,messages:()=>messagesPage(false),calendar:()=>calendarPage(false),settings:settingsPage,history:historyPage})[ui.page]?.()||adminDashboard();}
function modal(title,html,wide=false){return `<div class="modal-backdrop" data-action="close-modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-title"><h2>${esc(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="Close">${ic('close')}</button></div><div class="modal-content">${html}</div></section></div>`;}
function modalFields(s){return `<div class="form-grid"><div class="form-group"><label>First name</label><input class="field" name="first" required maxlength="32" value="${esc(s?.first||'')}"></div><div class="form-group"><label>Surname</label><input class="field" name="last" required maxlength="32" value="${esc(s?.last||'')}"></div><div class="form-group"><label>Tutor group</label><select class="select" name="tutor">${tutorOptions(s?.tutor||'7A')}</select></div><div class="form-group"><label>House</label><select class="select" name="house">${S.houses.map(h=>option(h,h,s?.house||'Oak')).join('')}</select></div></div>`;}
function renderModal(){if(ui.modal==='history')return historyModal();const s=getStudent(ui.activeStudent||ui.selectedStudent);switch(ui.modal){
case 'profile': {const bs=allBehaviour().filter(b=>b.studentId===s.id).slice(0,5);return modal('Student profile · '+s.name,`<div class="profile-hero"><div class="avatar">${esc(s.first[0]+s.last[0])}</div><div><h2>${esc(s.name)}</h2><p>${s.id} · Year ${s.year} · Form ${esc(s.tutor)}</p></div></div><div class="grid-details"><div class="detail"><small>House</small><strong>${esc(s.house)}</strong></div><div class="detail"><small>Reward points</small><strong>${persPoints(s)}</strong></div><div class="detail"><small>Attendance · ${dateNice(ui.date)}</small><strong>${letterText[getMark(s.id,ui.date)]}</strong></div></div><h3 style="font-size:13px">Recent behaviour</h3>${bs.map(b=>`<div class="notice-row"><strong>${esc(b.reason)}</strong> <span class="pill ${b.points>=0?'good':'bad'}">${b.points>0?'+':''}${b.points}</span><p>${dateNice(b.date)}</p></div>`).join('')||'<p class="tip">No recorded events.</p>'}<div class="form-actions"><button class="btn" data-action="edit-student" data-id="${s.id}">${ic('pencil')} Edit student</button><button class="btn primary" data-action="portal-person" data-id="${s.id}">${ic('graduation')} View student portal</button></div>`,true);}
case 'edit-student':return modal('Edit fictional student',`<form id="edit-student-form">${modalFields(s)}<div class="form-actions"><button class="btn primary" type="submit">Save pupil record</button></div></form>`);
case 'new-student':return modal('Add a fictional demo pupil',`<p class="tip">Adds one additional record on top of the original 1,400 sample pupils.</p><form id="new-student-form">${modalFields()}<div class="form-actions"><button class="btn primary" type="submit">${ic('plus')} Add demo pupil</button></div></form>`);
case 'new-behaviour':return modal('Record behaviour or reward',`<form id="behaviour-form"><div class="form-grid"><div class="form-group wide"><label>Student</label><select name="studentId" class="select" required>${allStudents().map(x=>option(x.id,x.name+' · '+x.tutor+' · '+x.id,ui.activeStudent||'OE01121')).join('')}</select></div><div class="form-group"><label>Event</label><select name="kind" class="select">${option('Positive','Positive / reward','Positive')}${option('Negative','Negative / incident','Positive')}</select></div><div class="form-group"><label>Points (signed number)</label><input name="points" type="number" class="field" min="-20" max="20" value="2" required></div><div class="form-group wide"><label>Reason</label><input name="reason" class="field" required maxlength="150" placeholder="e.g. Helpful behaviour in class"></div><div class="form-group"><label>Date</label><input type="date" class="field" name="date" value="${ui.date}" required></div></div><div class="form-actions"><button type="submit" class="btn primary">Save behaviour entry</button></div></form>`);
case 'new-message':return modal('Compose a demo message',`<form id="message-form"><div class="form-grid"><div class="form-group wide"><label>Recipient (all pupils, year, class, or a specific student ID)</label><input class="field" name="to" required maxlength="35" list="recipient-choices" value="All students"><datalist id="recipient-choices"><option value="All students"></option>${S.years.map(y=>`<option value="Year ${y}"></option>`).join('')}${S.years.flatMap(y=>S.letters.split('').map(a=>`<option value="${y+a}"></option>`)).join('')}</datalist></div><div class="form-group wide"><label>Subject</label><input name="subject" class="field" maxlength="100" required placeholder="School notice"></div><div class="form-group wide"><label>Message</label><textarea name="body" class="textarea" maxlength="1000" required placeholder="Type the message for the demo inbox..."></textarea></div></div><div class="form-actions"><button class="btn primary" type="submit">${ic('mail')} Send demo message</button></div></form>`);
case 'new-event':return modal('Add an archived calendar event',`<form id="event-form"><div class="form-grid"><div class="form-group wide"><label>Event title</label><input name="title" class="field" required maxlength="90"></div><div class="form-group"><label>Date</label><input name="date" type="date" class="field" required value="${ui.selectedDate||'2012-03-16'}"></div><div class="form-group"><label>Type</label><select name="type" class="select">${['School event','Parents evening','Holiday','Careers','Exams','Other'].map(x=>option(x,x,'School event')).join('')}</select></div></div><div class="form-actions"><button class="btn primary" type="submit">Save event</button></div></form>`);
case 'date':{const dates=allEvents().filter(x=>x.date===ui.selectedDate);return modal('School diary · '+dateNice(ui.selectedDate),`<div class="event-list">${dates.map(x=>`<div class="event-card"><b>${esc(x.title)}</b><p>${esc(x.type)}</p></div>`).join('')||'<p class="tip">No entries on this date.</p>'}</div>${ui.section==='staff'?`<div class="form-actions"><button class="btn primary" data-action="new-event">${ic('plus')} Add event for this day</button></div>`:''}`);}
default:return '';
}}
function render(){document.getElementById('app').innerHTML=shell(page());document.title='OneEducation (2012) · '+(ui.section==='portal'?'Student Portal':'Staff Demo');}
function csvDownload(name,rows){const str=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+str],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast('CSV export created.');}
function doExport(type){if(type==='students')csvDownload('OneEducation-2012-students.csv',[['ID','First name','Last name','Year','Tutor','House','Points'],...allStudents().map(s=>[s.id,s.first,s.last,s.year,s.tutor,s.house,persPoints(s)])]);if(type==='attendance'){const students=allStudents().filter(s=>s.tutor===ui.attTutor);csvDownload('OneEducation-2012-attendance-'+ui.attTutor+'.csv',[['Date','Student ID','Name','Tutor','Mark','Description'],...students.map(s=>[ui.date,s.id,s.name,s.tutor,getMark(s.id,ui.date),letterText[getMark(s.id,ui.date)]])]);}if(type==='report'){const list=allStudents();csvDownload('OneEducation-2012-report.csv',[['Year','Pupils','Present','Authorised','Unauthorised','Late','Present %'],...S.years.map(y=>{const g=list.filter(s=>s.year===y),t=tally(g);return [y,g.length,t.P,t.A,t.U,t.L,Math.round(100*t.P/g.length)];})]);}}
function modalOpen(kind,id){ui.modal=kind;if(id)ui.activeStudent=id;render();}
function handleAction(el){const action=el.dataset.action,id=el.dataset.id;
switch(action){case 'history':ui.historyId=id||'beginning';ui.modal='history';render();document.querySelector('.modal .icon-button')?.focus();break;
case 'mobile':ui.mobile=!ui.mobile;render();break;
case 'goto':go(el.dataset.page);break;
case 'switch':go(ui.section==='staff'?'home':'dashboard',ui.section==='staff'?'portal':'staff');break;
case 'open-portal':go('home','portal');break;
case 'profile':modalOpen('profile',id);break;
case 'edit-student':modalOpen('edit-student',id);break;
case 'new-student':modalOpen('new-student');break;
case 'new-behaviour':ui.activeStudent=null;modalOpen('new-behaviour');break;
case 'new-message':modalOpen('new-message');break;
case 'new-event':modalOpen('new-event');break;
case 'event-date':ui.selectedDate=el.dataset.date;modalOpen('date');break;
case 'close-modal':ui.modal='';render();break;
case 'close-modal-backdrop':if(el.classList.contains('modal-backdrop')){ui.modal='';render();}break;
case 'portal-person':ui.selectedStudent=id;go('home','portal');break;
case 'search-students':ui.query=document.getElementById('student-search')?.value||'';ui.studentPage=0;render();break;
case 'clear-search':ui.query='';ui.year='all';ui.tutor='all';ui.studentPage=0;render();break;
case 'prev-page':ui.studentPage=Math.max(0,ui.studentPage-1);render();break;
case 'next-page':ui.studentPage++;render();break;
case 'mark-all':allStudents().filter(s=>s.tutor===ui.attTutor).forEach(s=>db.attendance[attKey(s.id,ui.date)]='P');persist();render();toast('Entire '+ui.attTutor+' register marked present.');break;
case 'reset-register':if(confirm('Restore the original demonstration marks for '+ui.attTutor+' on '+ui.date+'?')){allStudents().filter(s=>s.tutor===ui.attTutor).forEach(s=>delete db.attendance[attKey(s.id,ui.date)]);persist();render();toast('Original marks restored.');}break;
case 'day':ui.day=el.dataset.day;render();break;
case 'homework':{const key=ui.selectedStudent+'_'+id;db.homeworkDone[key]=!db.homeworkDone[key];persist();render();toast(db.homeworkDone[key]?'Homework marked complete.':'Homework returned to to-do.');break;}
case 'save-locker':{db.lockerNotes=db.lockerNotes||{};db.lockerNotes[ui.selectedStudent]=document.getElementById('locker-note')?.value||'';persist();toast('Locker note saved for this demo pupil.');break;}
case 'cal-prev':case 'cal-next':{const [y,m]=ui.calendarMonth.split('-').map(Number);const next=new Date(y,m-1+(action==='cal-prev'?-1:1),1);ui.calendarMonth=next.getFullYear()+'-'+String(next.getMonth()+1).padStart(2,'0');render();break;}
case 'resolve-behaviour':{db.behaviourStatus=db.behaviourStatus||{};db.behaviourStatus[id]='Resolved';persist();render();toast('Incident marked resolved.');break;}
case 'delete-message':if(confirm('Delete this demo message?')){db.messages=db.messages.filter(m=>m.id!==id);persist();render();toast('Message deleted.');}break;
case 'delete-event':if(confirm('Remove this demo event?')){db.events=db.events.filter(e=>e.id!==id);persist();render();toast('Event removed.');}break;
case 'reset':if(confirm('Reset the whole 2012 demo? This deletes local changes and restores exactly 1,400 fictional pupils.')){db=defaultDB();localStorage.removeItem(KEY);ui.selectedStudent='OE01121';ui.modal='';go('dashboard','staff');toast('Demo reset to 1,400 fictional pupils.');}break;
case 'export-students':doExport('students');break;case 'export-attendance':doExport('attendance');break;case 'export-report':doExport('report');break;
case 'print':window.print();break;
}}
function handleForm(form){const data=Object.fromEntries(new FormData(form));switch(form.id){
case 'settings-form':db.schoolName=data.schoolName.trim();persist();render();toast('School name updated.');break;
case 'new-student-form':{const tutor=data.tutor;const num=db.nextId++;const s={id:'OE'+String(num).padStart(5,'0'),first:data.first.trim(),last:data.last.trim(),name:data.first.trim()+' '+data.last.trim(),year:Number(tutor.match(/\d+/)[0]),tutor,house:data.house,points:0,demo:true};db.newStudents.push(s);persist();ui.activeStudent=s.id;ui.modal='profile';render();toast('Demo student added: '+s.id);break;}
case 'edit-student-form':{const id=ui.activeStudent;db.studentEdits[id]={first:data.first.trim(),last:data.last.trim(),name:data.first.trim()+' '+data.last.trim(),tutor:data.tutor,year:Number(data.tutor.match(/\d+/)[0]),house:data.house};persist();ui.modal='profile';render();toast('Fictional pupil record updated.');break;}
case 'behaviour-form':{const points=Number(data.points);if(!getStudent(data.studentId)||!Number.isFinite(points)||points<-20||points>20){toast('Choose a valid student and points value.',true);return;}db.behaviour.push({id:'N'+Date.now(),studentId:data.studentId,kind:data.kind,reason:data.reason.trim(),points,date:safeDate(data.date),time:'10:00',status:data.kind==='Positive'?'Closed':'Open'});persist();ui.modal='';render();toast('Behaviour entry saved; points updated.');break;}
case 'message-form':{const target=data.to.trim();if(target!=='All students'&&!/^Year (7|8|9|10|11)$/.test(target)&&!/^(7|8|9|10|11)[A-H]$/.test(target)&&!getStudent(target)){toast('Use All students, a year (Year 10), form (10A) or an existing OE student ID.',true);return;}db.messages.push({id:'N'+Date.now(),to:target,subject:data.subject.trim(),body:data.body.trim(),date:'2012-03-16',from:'School Office',unread:true});persist();ui.modal='';render();toast('Demo message delivered to matching portal inboxes.');break;}
case 'event-form':db.events.push({id:'N'+Date.now(),date:safeDate(data.date),title:data.title.trim(),type:data.type});ui.calendarMonth=data.date.slice(0,7);ui.modal='';persist();render();toast('Event added to school calendar.');break;
}}
// Delegated handlers survive view switches without re-binding the 1,400-row data UI.
document.addEventListener('click',e=>{if(e.target.classList?.contains('modal-backdrop')){handleAction(e.target);return;}const el=e.target.closest('[data-action]:not(.modal-backdrop)');if(el)handleAction(el);});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='portal-student'){ui.selectedStudent=el.value;render();return;}if(el.dataset.mark){db.attendance[attKey(el.dataset.mark,ui.date)]=el.value;persist();render();toast('Attendance mark saved.');return;}if(el.dataset.filter){const key=el.dataset.filter;ui[key]=el.value;if(key==='year'||key==='tutor')ui.studentPage=0;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='student-search'){e.preventDefault();ui.query=e.target.value;ui.studentPage=0;render();}if(e.key==='Escape'&&ui.modal){ui.modal='';render();}});
document.addEventListener('submit',e=>{if(e.target.matches('form')){e.preventDefault();handleForm(e.target);}});
window.addEventListener('hashchange',()=>{fromHash();ui.modal='';render();});
// A safe localStorage migration when an older run saved a partial state.
for(const field of ['attendance','studentEdits','homeworkDone'])db[field]=db[field]||{};
for(const field of ['newStudents','behaviour','messages','events'])db[field]=Array.isArray(db[field])?db[field]:[];
if(!db.nextId)db.nextId=1401+db.newStudents.length;
fromHash();render();
window.OneEducationDemo={countStudents:()=>allStudents().length,version:'2012',demoOnly:true};
})();

  </script>
</body>
</html>
